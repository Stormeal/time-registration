name: Windows quality gate

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies and project
        shell: pwsh
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --no-deps -r requirements/windows-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependencies failed to install.' }
          & .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { throw 'Project failed to install.' }
          & .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency consistency check failed.' }
      - name: Verify Edge fixture browser
        shell: pwsh
        run: |
          $edge = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $edge)) { throw 'Edge is required for intercepted browser fixture tests.' }
      - name: Run project quality gate
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Run independent core gate without desktop adapters
        shell: pwsh
        run: .\scripts\check-core.ps1
