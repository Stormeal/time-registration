[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "qi-flow"
version = "0.1.1"
description = "A local-first Windows work-time tracker."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "QI Flow contributors" }]
dependencies = [
    "PySide6>=6.8,<7",
    "tzdata>=2025.2",
    "playwright>=1.58,<2",
    "keyring>=25.6,<26",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=9,<10",
    "pytest-qt>=4.5,<5",
    "ruff>=0.12,<1",
]

[project.gui-scripts]
qi-flow = "qi_flow.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qi_flow"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/ARCHITECTURE.md",
    "/DECISIONS.md",
    "/DESIGN.md",
    "/REQUIREMENTS.md",
    "/USER_STORIES.md",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".tmp", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["qi_flow"]
exclude = ["^build/", "^dist/"]
